<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mreža za znamenke u 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: 3D pozornica lijevo (mreža teče slijeva nadesno), radni stol desno: crtanje + opis odabranog sloja. Jedan, tamni izgled (projektor). */
:root {
  --bg: #0b1c29;          /* noćna plava, kao pozadina slajdova */
  --panel: #12293a;
  --line: #24425a;
  --fg: #e7eef5;
  --muted: #93a9bc;
  --accent: #f97316;      /* narančasta = aktivacija / odabrano */
  --accent-2: #fbbf24;
  --blue: #60a5fa;
  --font-display: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
  --font-body: "Inter", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--fg); }
body { font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px 28px; max-width: 1500px; margin: 0 auto; }
header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; margin-bottom: 14px; }
h1 { font-family: var(--font-display); font-size: clamp(24px, 3vw, 34px); margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
header p { margin: 0; color: var(--muted); max-width: 70ch; }
.grid { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 16px; align-items: start; }
@media (max-width: 980px) { .grid { grid-template-columns: minmax(0, 1fr); } }
.stage { position: relative; background: radial-gradient(120% 90% at 30% 20%, #15324a 0%, var(--bg) 70%); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; height: min(72vh, 680px); min-height: 380px; }
.stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.labels { position: absolute; inset: 0; pointer-events: none; }
.lbl { position: absolute; transform: translate(-50%, -100%); text-align: center; white-space: nowrap; pointer-events: auto; cursor: pointer;
  font-size: 12px; line-height: 1.25; padding: 4px 7px; border-radius: 7px; background: rgba(11, 28, 41, 0.78); border: 1px solid var(--line); }
.lbl b { display: block; font-family: var(--font-display); font-size: 13px; font-weight: 700; }
.lbl span { font-family: var(--font-mono); color: var(--muted); font-size: 11px; }
.lbl.below { transform: translate(-50%, 0); }
.lbl.on { border-color: var(--accent); }
.lbl.on b { color: var(--accent); }
.hint { position: absolute; left: 12px; bottom: 10px; font-size: 12px; color: var(--muted); background: rgba(11, 28, 41, 0.7); padding: 4px 8px; border-radius: 6px; }
.toolbar { position: absolute; right: 10px; top: 10px; display: flex; gap: 6px; }
aside { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; min-width: 0; }
.card h2 { font-family: var(--font-display); font-size: 17px; margin: 0 0 8px; }
.eyebrow { text-transform: uppercase; letter-spacing: 0.08em; font-size: 11px; color: var(--muted); font-weight: 600; }
.draw-row { display: flex; gap: 12px; align-items: flex-start; flex-wrap: wrap; }
#pad { width: 168px; height: 168px; background: #000; border-radius: 10px; border: 1px solid var(--line); touch-action: none; cursor: crosshair; }
.side-mini { display: flex; flex-direction: column; gap: 8px; }
#seen { width: 84px; height: 84px; image-rendering: pixelated; border-radius: 6px; border: 1px solid var(--line); background: #000; }
.small { font-size: 12px; color: var(--muted); }
button { font: inherit; font-size: 13px; color: var(--fg); background: #1a3a52; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; cursor: pointer; }
button:hover { border-color: var(--blue); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.samples { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; margin-top: 10px; }
.samples button { padding: 5px 0; font-family: var(--font-mono); }
.pred { display: flex; align-items: center; gap: 14px; margin-top: 12px; }
.pred .big { font-family: var(--font-display); font-size: 54px; font-weight: 700; color: var(--accent); line-height: 1; min-width: 40px; }
.bars { flex: 1; display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; align-items: end; height: 64px; }
.bar { background: #2b4d67; border-radius: 3px 3px 0 0; position: relative; min-height: 2px; }
.bar.max { background: var(--accent); }
.bar i { position: absolute; bottom: -17px; left: 0; right: 0; text-align: center; font-style: normal; font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
.bars-wrap { padding-bottom: 18px; flex: 1; }
dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; margin: 8px 0 10px; font-size: 13px; }
dt { color: var(--muted); }
dd { margin: 0; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
#info p { margin: 0 0 8px; }
#maps { display: grid; gap: 3px; margin-top: 6px; }
#maps canvas { width: 100%; aspect-ratio: 1; image-rendering: pixelated; border-radius: 3px; background: #000; display: block; }
.formula { font-family: var(--font-mono); font-size: 12px; color: var(--accent-2); background: #0e2233; border-radius: 6px; padding: 6px 8px; overflow-x: auto; }
.legend { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); margin-top: 8px; }
.legend .ramp { height: 8px; flex: 1; border-radius: 4px; background: linear-gradient(90deg, #000 0%, #3b1d5a 25%, #c2410c 60%, #f97316 75%, #fde68a 100%); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<style>body{margin:0}</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Mreža za znamenke u 3D</h1>
    <p>Svaka pločica je jedna mapa značajki. Nacrtajte znamenku i gledajte kako prolazi kroz svih 9 slojeva, od 784 piksela do 10 postotaka.</p>
  </header>
  <div class="grid">
    <div class="stage" id="stage">
      <div class="labels" id="labels"></div>
      <div class="toolbar">
        <button id="spin" type="button" aria-pressed="false">Okreći se</button>
        <button id="reset" type="button">Početni pogled</button>
      </div>
      <div class="hint">Povuci = okreni · kotačić = zum · klik na sloj = opis</div>
    </div>
    <aside>
      <section class="card">
        <div class="eyebrow">Ulaz</div>
        <h2>Nacrtajte znamenku</h2>
        <div class="draw-row">
          <canvas id="pad" width="280" height="280" aria-label="Polje za crtanje znamenke"></canvas>
          <div class="side-mini">
            <div class="small">Mreža vidi (28 × 28)</div>
            <canvas id="seen" width="28" height="28" aria-label="Slika 28 × 28 koju dobije mreža"></canvas>
            <button id="clear" type="button">Obriši</button>
          </div>
        </div>
        <div class="small" style="margin-top:10px">ili uzmite znamenku iz skupa MNIST:</div>
        <div class="samples" id="samples"></div>
        <div class="pred">
          <div class="big" id="big">–</div>
          <div class="bars-wrap"><div class="bars" id="bars"></div></div>
        </div>
      </section>
      <section class="card" id="info"></section>
    </aside>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function () {
  "use strict";
  const DATA = JSON.parse(document.getElementById("data").textContent);

  // ---------- težine ----------
  const raw = Uint8Array.from(atob(DATA.w), c => c.charCodeAt(0));
  const flat = new Float32Array(raw.buffer);
  let off = 0;
  const T = DATA.shapes.map(sh => { const n = sh.reduce((a, b) => a * b, 1); const a = flat.subarray(off, off + n); off += n; return a; });
  const [k1, b1, k2, b2, k3, b3, k4, b4, wd, bd] = T;

  // ---------- računanje (podaci u obliku V × Š × K) ----------
  function conv(x, H, Wd, C, k, b, F) {
    const y = new Float32Array(H * Wd * F);
    for (let i = 0; i < H; i++) for (let j = 0; j < Wd; j++) {
      const o = (i * Wd + j) * F;
      for (let f = 0; f < F; f++) y[o + f] = b[f];
      for (let di = 0; di < 3; di++) { const ii = i + di - 1; if (ii < 0 || ii >= H) continue;
        for (let dj = 0; dj < 3; dj++) { const jj = j + dj - 1; if (jj < 0 || jj >= Wd) continue;
          const xo = (ii * Wd + jj) * C, ko = (di * 3 + dj) * C * F;
          for (let c = 0; c < C; c++) { const v = x[xo + c]; if (v === 0) continue; const kk = ko + c * F;
            for (let f = 0; f < F; f++) y[o + f] += v * k[kk + f]; } } }
      for (let f = 0; f < F; f++) if (y[o + f] < 0) y[o + f] = 0;   // ReLU
    }

  }
  function pool(x, H, Wd, C) {
    const h = H / 2, w = Wd / 2, y = new Float32Array(h * w * C);
    for (let i = 0; i < h; i++) for (let j = 0; j < w; j++) for (let c = 0; c < C; c++) {
      let m = -Infinity;
      for (let a = 0; a < 2; a++) for (let d = 0; d < 2; d++) m = Math.max(m, x[((2 * i + a) * Wd + 2 * j + d) * C + c]);
      y[(i * w + j) * C + c] = m;
    }

  }
  function forward(img) {
    const a1 = conv(img, 28, 28, 1, k1, b1, 16), p1 = pool(a1, 28, 28, 16);
    const a2 = conv(p1, 14, 14, 16, k2, b2, 32), p2 = pool(a2, 14, 14, 32);
    const a3 = conv(p2, 7, 7, 32, k3, b3, 32), a4 = conv(a3, 7, 7, 32, k4, b4, 64);
    const g = new Float32Array(64);
    for (let p = 0; p < 49; p++) for (let c = 0; c < 64; c++) g[c] += a4[p * 64 + c] / 49;
    const z = new Float32Array(10);
    for (let o = 0; o < 10; o++) { let s = bd[o]; for (let c = 0; c < 64; c++) s += g[c] * wd[c * 10 + o]; z[o] = s; }
    const mx = Math.max(...z); let sum = 0; const p = z.map(v => { const e = Math.exp(v - mx); sum += e; return e; }).map(v => v / sum);
    return { input: img, c1: a1, p1, c2: a2, p2, c3: a3, c4: a4, gap: g, dense: p };
  }

  // ---------- opis slojeva (prema model.summary()) ----------
  const LAYERS = [
    { key: "input", name: "Ulaz", keras: "slika (InputLayer)", hw: 28, ch: 1, params: "0",
      text: "Slika znamenke: 28 × 28 piksela, svaki broj od 0 (crno) do 1 (bijelo). Ukupno 784 broja.", formula: "" },
    { key: "c1", name: "Konvolucija 1", keras: "conv2d (Conv2D)", hw: 28, ch: 16, params: "160",
      text: "16 filtera veličine 3 × 3 klizi po slici i traži rubove i crtice. Svaki filter daje svoju mapu značajki. Nakon toga ReLU negativne brojeve pretvori u 0.",
      formula: "3·3·1·16 težina + 16 pomaka = 160" },
    { key: "p1", name: "Max pooling 1", keras: "max_pooling2d (MaxPooling2D)", hw: 14, ch: 16, params: "0",
      text: "Iz svakog kvadrata 2 × 2 zadrži se najveći broj. Mape postanu 4 puta manje, a ostaje informacija je li filter nešto našao. Ovaj sloj nema što učiti.",
      formula: "28 × 28 → 14 × 14" },
    { key: "c2", name: "Konvolucija 2", keras: "conv2d_1 (Conv2D)", hw: 14, ch: 32, params: "4 640",
      text: "32 filtera, a svaki gleda 3 × 3 komadić u SVIH 16 mapa odjednom. Tako se rubovi slažu u jednostavne oblike: zavoje, kutove, krajeve crta.",
      formula: "3·3·16·32 + 32 = 4 640" },
    { key: "p2", name: "Max pooling 2", keras: "max_pooling2d_1 (MaxPooling2D)", hw: 7, ch: 32, params: "0",
      text: "Još jedno smanjivanje: 14 × 14 → 7 × 7. Svaki piksel sada pokriva velik dio originalne slike.",
      formula: "14 × 14 → 7 × 7" },
    { key: "c3", name: "Konvolucija 3", keras: "conv2d_2 (Conv2D)", hw: 7, ch: 32, params: "9 248",
      text: "32 filtera nad 32 mape. Značajke postaju sve apstraktnije: više nisu rubovi, nego dijelovi znamenki.",
      formula: "3·3·32·32 + 32 = 9 248" },
    { key: "c4", name: "Konvolucija 4", keras: "conv2d_3 (Conv2D)", hw: 7, ch: 64, params: "18 496",
      text: "Najveći sloj: 64 filtera, više od polovice svih težina mreže. Svaka od 64 mape odgovara na neki dio znamenke, npr. „gornja petlja” ili „okomita crta desno”.",
      formula: "3·3·32·64 + 64 = 18 496" },
    { key: "gap", name: "Globalni prosjek", keras: "global_average_pooling2d", hw: 0, ch: 64, params: "0",
      text: "Svaka mapa 7 × 7 zamijeni se jednim brojem, svojim prosjekom. Ostaje 64 broja: koliko je svake značajke na slici, bez obzira gdje je.",
      formula: "64 mape 7 × 7 → 64 broja" },
    { key: "dense", name: "Gusti sloj + softmax", keras: "dense (Dense)", hw: 0, ch: 10, params: "650",
      text: "Isto kao linearni model, ali nad 64 značajke umjesto 784 piksela. Softmax pretvori 10 rezultata u postotke koji zajedno daju 100 %.",
      formula: "64·10 težina + 10 pomaka = 650" },
  ];
  const shapeStr = L => L.key === "gap" ? "(1, 64)" : L.key === "dense" ? "(1, 10)" : `(1, ${L.hw}, ${L.hw}, ${L.ch})`;

  // ---------- boje ----------
  const STOPS = [[0, [0, 0, 0]], [0.25, [59, 29, 90]], [0.6, [194, 65, 12]], [0.75, [249, 115, 22]], [1, [253, 230, 138]]];
  function ramp(t) {
    t = Math.max(0, Math.min(1, t));
    for (let i = 1; i < STOPS.length; i++) if (t <= STOPS[i][0]) {
      const [t0, c0] = STOPS[i - 1], [t1, c1] = STOPS[i], u = (t - t0) / (t1 - t0);
      return [0, 1, 2].map(k => Math.round(c0[k] + (c1[k] - c0[k]) * u));
    }
    return STOPS[STOPS.length - 1][1];
  }

  // ---------- scena ----------
  const stage = document.getElementById("stage"), labelsEl = document.getElementById("labels");
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  stage.prepend(renderer.domElement);
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 400);
  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true; controls.dampingFactor = 0.08;
  scene.add(new THREE.AmbientLight(0xffffff, 0.75));
  const dl = new THREE.DirectionalLight(0xffffff, 0.55); dl.position.set(5, 12, 10); scene.add(dl);

  const size = hw => 0.8 + hw * 0.09;
  const GAP = { input: 0, c1: 0.12, p1: 0.12, c2: 0.085, p2: 0.085, c3: 0.085, c4: 0.065 };
  const SPACE = 1.5;
  const groups = {}, planes = {}, edges = {}, pickables = [];
  let x = 0;
  const frames = [];
  LAYERS.forEach(L => {
    const g = new THREE.Group(); g.userData.layer = L.key; scene.add(g); groups[L.key] = g;
    if (L.hw) {
      // mape stoje licem prema gledatelju (+z), a slažu se u dubinu (−z): prva mapa je sprijeda
      const s = size(L.hw), cx = x + s / 2; planes[L.key] = []; edges[L.key] = [];
      for (let c = L.ch - 1; c >= 0; c--) {
        const data = new Uint8Array(L.hw * L.hw * 4);
        const tex = new THREE.DataTexture(data, L.hw, L.hw, THREE.RGBAFormat);
        tex.magFilter = THREE.NearestFilter; tex.minFilter = THREE.NearestFilter; tex.flipY = true; tex.needsUpdate = true;
        const m = new THREE.Mesh(new THREE.PlaneGeometry(s, s), new THREE.MeshBasicMaterial({ map: tex, side: THREE.DoubleSide }));
        m.position.set(cx, s / 2, -c * GAP[L.key]);
        m.userData.layer = L.key; g.add(m); pickables.push(m); planes[L.key][c] = { mesh: m, data, tex };
        const e = new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry), new THREE.LineBasicMaterial({ color: 0x2c4f6a }));
        e.position.copy(m.position); g.add(e); edges[L.key][c] = e;
      }
      const depth = (L.ch - 1) * GAP[L.key];
      frames.push({ key: L.key, x0: x, x1: x + s, y0: 0, y1: s, z0: -depth, z1: 0 });
      g.userData.top = new THREE.Vector3(cx, s + 0.3, -depth / 2); g.userData.bottom = new THREE.Vector3(cx, -0.75, 0);
      x += s + SPACE;
    } else if (L.key === "gap") {
      planes.gap = []; const n = 8, cs = 0.2, st = 0.27, w = n * st;
      for (let i = 0; i < 64; i++) {
        const r = Math.floor(i / n), c = i % n;
        const m = new THREE.Mesh(new THREE.BoxGeometry(cs, cs, cs), new THREE.MeshLambertMaterial({ color: 0x223344 }));
        m.position.set(x + st / 2 + c * st, 0.2 + (n - 1 - r) * st + st / 2, 0); m.userData.layer = "gap";
        g.add(m); pickables.push(m); planes.gap.push(m);
      }
      frames.push({ key: "gap", x0: x, x1: x + w, y0: 0.2, y1: 0.2 + w, z0: 0, z1: 0 });
      g.userData.top = new THREE.Vector3(x + w / 2, 0.2 + w + 0.3, 0); g.userData.bottom = new THREE.Vector3(x + w / 2, -0.75, 0);
      x += w + SPACE;
    } else {
      planes.dense = []; const st = 0.42, w = 10 * st;
      for (let i = 0; i < 10; i++) {
        const bx = x + st / 2 + i * st;
        const m = new THREE.Mesh(new THREE.BoxGeometry(0.3, 1, 0.3), new THREE.MeshLambertMaterial({ color: 0x2b4d67 }));
        m.position.set(bx, 0.5, 0); m.userData.layer = "dense"; g.add(m); pickables.push(m);
        const cv = document.createElement("canvas"); cv.width = cv.height = 64; const ctx = cv.getContext("2d");
        ctx.fillStyle = "#e7eef5"; ctx.font = "600 44px JetBrains Mono, monospace"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(String(i), 32, 34);
        const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(cv), transparent: true }));
        sp.scale.set(0.38, 0.38, 1); sp.position.set(bx, -0.3, 0.2); g.add(sp);
        planes.dense.push(m);
      }
      frames.push({ key: "dense", x0: x, x1: x + w, y0: 0, y1: 0.8, z0: 0, z1: 0 });
      g.userData.top = new THREE.Vector3(x + w / 2, 3.2, 0); g.userData.bottom = new THREE.Vector3(x + w / 2, -0.9, 0);
      x += w;
    }
  });
  const TOTAL = x;
  // tanke linije između slojeva
  const lineMat = new THREE.LineBasicMaterial({ color: 0x3b6a8c, transparent: true, opacity: 0.5 });
  for (let i = 0; i < frames.length - 1; i++) {
    const a = frames[i], b = frames[i + 1], pts = [];
    [[a.y0, b.y0], [a.y1, b.y1]].forEach(([ya, yb]) => [[a.z1, b.z1], [a.z0, b.z0]].forEach(([za, zb]) =>
      pts.push(new THREE.Vector3(a.x1, ya, za), new THREE.Vector3(b.x0, yb, zb))));
    scene.add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(pts), lineMat));
  }
  const floor = new THREE.GridHelper(Math.ceil(TOTAL) + 10, Math.ceil(TOTAL) + 10, 0x1d3a50, 0x15304a);
  floor.position.set(TOTAL / 2, -0.6, -2); scene.add(floor);

  // oznake
  const labelEls = {};
  LAYERS.forEach(L => {
    const d = document.createElement("div"); d.className = "lbl"; d.innerHTML = `<b>${L.name}</b><span>${shapeStr(L)}</span>`;
    d.addEventListener("click", () => select(L.key)); labelsEl.appendChild(d); labelEls[L.key] = d;
  });

  const target0 = new THREE.Vector3(TOTAL / 2, 1.4, -1.2);
  function resetView() {
    const hf = 2 * Math.atan(Math.tan(camera.fov * Math.PI / 360) * camera.aspect);
    const dist = (TOTAL / 2 + 2.6) / Math.tan(hf / 2);
    const dir = new THREE.Vector3(0.2, 0.36, 1).normalize();
    camera.position.copy(target0).addScaledVector(dir, dist); controls.target.copy(target0); controls.update();
  }
  function resize() {
    const w = stage.clientWidth, h = stage.clientHeight;
    renderer.setSize(w, h, false); camera.aspect = w / h;
    camera.fov = w < 600 ? 52 : 38; camera.updateProjectionMatrix();
  }
  let firstFit = true;
  new ResizeObserver(() => { resize(); if (firstFit) { resetView(); firstFit = false; } }).observe(stage); resize(); resetView();

  const v = new THREE.Vector3();
  function placeLabels() {
    const w = stage.clientWidth, h = stage.clientHeight;
    LAYERS.forEach((L, i) => {
      const below = i % 2 === 1;
      v.copy(below ? groups[L.key].userData.bottom : groups[L.key].userData.top).project(camera);
      labelEls[L.key].classList.toggle("below", below);
      const el = labelEls[L.key];
      if (v.z > 1 || (w < 640 && L.key !== selected)) { el.hidden = true; return; }   // na mobitelu samo odabrani sloj
      el.hidden = false; el.style.left = ((v.x + 1) / 2 * w) + "px"; el.style.top = ((1 - v.y) / 2 * h) + "px";
    });
  }
  let spinning = false;
  const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  (function loop() {
    requestAnimationFrame(loop);
    controls.autoRotate = spinning && !reduce; controls.autoRotateSpeed = 0.8;
    controls.update(); renderer.render(scene, camera); placeLabels();
  })();
  document.getElementById("reset").addEventListener("click", resetView);
  const spinBtn = document.getElementById("spin");
  spinBtn.addEventListener("click", () => { spinning = !spinning; spinBtn.setAttribute("aria-pressed", String(spinning)); spinBtn.textContent = spinning ? "Zaustavi" : "Okreći se"; });

  // odabir klikom
  const ray = new THREE.Raycaster(), mouse = new THREE.Vector2(); let downAt = null;
  renderer.domElement.addEventListener("pointerdown", e => { downAt = [e.clientX, e.clientY]; });
  renderer.domElement.addEventListener("pointerup", e => {
    if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 5) return;
    const r = renderer.domElement.getBoundingClientRect();
    mouse.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(mouse, camera); const hit = ray.intersectObjects(pickables)[0];
    if (hit) select(hit.object.userData.layer);
  });
  renderer.domElement.addEventListener("pointermove", e => {
    const r = renderer.domElement.getBoundingClientRect();
    mouse.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(mouse, camera); renderer.domElement.style.cursor = ray.intersectObjects(pickables).length ? "pointer" : "grab";
  });

  // ---------- prikaz aktivacija ----------
  var state = null, selected = "c1";
  function layerMax(key, arr) { let m = 0; for (let i = 0; i < arr.length; i++) if (arr[i] > m) m = arr[i]; return m || 1; }
  function paintPlanes(key, arr, hw, ch) {
    const mx = key === "input" ? 1 : layerMax(key, arr);
    planes[key].forEach((p, c) => {
      for (let i = 0; i < hw * hw; i++) {
        const val = arr[i * ch + c] / mx;
        const col = key === "input" ? [val * 255, val * 255, val * 255] : ramp(val);
        p.data[i * 4] = col[0]; p.data[i * 4 + 1] = col[1]; p.data[i * 4 + 2] = col[2]; p.data[i * 4 + 3] = 255;
      }
      p.tex.needsUpdate = true;
      if (key !== "input") {   // rub pločice svijetli koliko je mapa aktivna
        let s = 0; for (let i = 0; i < hw * hw; i++) s += arr[i * ch + c];
        const m = s / (hw * hw) / mx, col = ramp(Math.min(1, 0.15 + m * 3));
        edges[key][c].material.color.setRGB(col[0] / 255, col[1] / 255, col[2] / 255);
      }
    });
  }
  function update(img) {
    state = forward(img);
    LAYERS.forEach(L => { if (L.hw) paintPlanes(L.key, state[L.key], L.hw, L.ch); });
    const gm = layerMax("gap", state.gap);
    planes.gap.forEach((m, i) => { const c = ramp(state.gap[i] / gm); m.material.color.setRGB(c[0] / 255, c[1] / 255, c[2] / 255); });
    const p = state.dense, best = p.indexOf(Math.max(...p));
    planes.dense.forEach((m, i) => { const h = 0.08 + p[i] * 2.6; m.scale.y = h; m.position.y = h / 2; m.material.color.set(i === best ? 0xf97316 : 0x2b4d67); });
    document.getElementById("big").textContent = String(best);
    const bars = document.getElementById("bars"); bars.innerHTML = "";
    p.forEach((v, i) => { const b = document.createElement("div"); b.className = "bar" + (i === best ? " max" : ""); b.style.height = Math.max(2, v * 100) + "%";
      b.title = `${i}: ${(v * 100).toFixed(1)} %`; b.innerHTML = `<i>${i}</i>`; bars.appendChild(b); });
    const seen = document.getElementById("seen").getContext("2d"), id = seen.createImageData(28, 28);
    for (let i = 0; i < 784; i++) { const g = Math.round(img[i] * 255); id.data[i * 4] = id.data[i * 4 + 1] = id.data[i * 4 + 2] = g; id.data[i * 4 + 3] = 255; }
    seen.putImageData(id, 0, 0);
    renderInfo();
  }

  function select(key) { selected = key; renderInfo(); }
  function renderInfo() {
    Object.entries(labelEls).forEach(([k, el]) => el.classList.toggle("on", k === selected));
    const L = LAYERS.find(l => l.key === selected), box = document.getElementById("info");
    let extra = "";
    if (state && selected === "dense") {
      const p = state.dense; const best = p.indexOf(Math.max(...p));
      extra = `<p class="small">Sada: najveći postotak ima <b style="color:var(--accent)">${best}</b> (${(p[best] * 100).toFixed(1)} %).</p>`;
    }
    box.innerHTML = `<div class="eyebrow">Odabrani sloj</div><h2>${L.name}</h2>
      <dl><dt>Keras</dt><dd>${L.keras}</dd><dt>Izlaz</dt><dd>${shapeStr(L)}</dd><dt>Težine</dt><dd>${L.params}</dd></dl>
      <p>${L.text}</p>${L.formula ? `<div class="formula">${L.formula}</div>` : ""}${extra}
      <div id="maps"></div>
      ${L.hw && L.key !== "input" ? `<div class="legend"><span>0</span><div class="ramp"></div><span>najjače</span></div>` : ""}`;
    if (!state) return;
    const maps = document.getElementById("maps");
    if (L.hw) {
      const cols = L.ch === 1 ? 2 : L.ch <= 16 ? 4 : 8;
      maps.style.gridTemplateColumns = `repeat(${cols}, minmax(0, 1fr))`;
      const arr = state[L.key], mx = L.key === "input" ? 1 : layerMax(L.key, arr);
      for (let c = 0; c < L.ch; c++) {
        const cv = document.createElement("canvas"); cv.width = cv.height = L.hw; cv.title = `mapa ${c + 1}`;
        const cx = cv.getContext("2d"), id = cx.createImageData(L.hw, L.hw);
        for (let i = 0; i < L.hw * L.hw; i++) { const val = arr[i * L.ch + c] / mx; const col = L.key === "input" ? [val * 255, val * 255, val * 255] : ramp(val);
          id.data[i * 4] = col[0]; id.data[i * 4 + 1] = col[1]; id.data[i * 4 + 2] = col[2]; id.data[i * 4 + 3] = 255; }
        cx.putImageData(id, 0, 0); maps.appendChild(cv);
      }
    }
  }

  // ---------- crtanje ----------
  const pad = document.getElementById("pad"), pc = pad.getContext("2d");
  function clearPad() { pc.fillStyle = "#000"; pc.fillRect(0, 0, 280, 280); }
  clearPad();
  let drawing = false, last = null, pending = false;
  function pos(e) { const r = pad.getBoundingClientRect(); return [(e.clientX - r.left) * 280 / r.width, (e.clientY - r.top) * 280 / r.height]; }
  pad.addEventListener("pointerdown", e => { drawing = true; last = pos(e); pad.setPointerCapture(e.pointerId); stroke(last); });
  pad.addEventListener("pointermove", e => { if (!drawing) return; stroke(pos(e)); });
  ["pointerup", "pointercancel", "pointerleave"].forEach(t => pad.addEventListener(t, () => { if (drawing) { drawing = false; runPad(); } }));
  function stroke(p) {
    pc.strokeStyle = "#fff"; pc.lineWidth = 22; pc.lineCap = pc.lineJoin = "round";
    pc.beginPath(); pc.moveTo(last[0], last[1]); pc.lineTo(p[0], p[1]); pc.stroke(); last = p;
    if (!pending) { pending = true; setTimeout(() => { pending = false; runPad(); }, 120); }
  }
  // kao MNIST: znamenka u kvadratu 20 × 20, centrirana po težištu u slici 28 × 28
  function runPad() {
    const d = pc.getImageData(0, 0, 280, 280).data;
    let x0 = 280, y0 = 280, x1 = -1, y1 = -1;
    for (let y = 0; y < 280; y++) for (let x = 0; x < 280; x++) if (d[(y * 280 + x) * 4] > 40) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
    if (x1 < 0) return;
    const w = x1 - x0 + 1, h = y1 - y0 + 1, sc = 20 / Math.max(w, h);
    const tmp = document.createElement("canvas"); tmp.width = tmp.height = 28; const tc = tmp.getContext("2d");
    tc.fillStyle = "#000"; tc.fillRect(0, 0, 28, 28); tc.imageSmoothingEnabled = true; tc.imageSmoothingQuality = "high";
    tc.drawImage(pad, x0, y0, w, h, 14 - w * sc / 2, 14 - h * sc / 2, w * sc, h * sc);
    let td = tc.getImageData(0, 0, 28, 28).data, sx = 0, sy = 0, s = 0;
    for (let i = 0; i < 784; i++) { const val = td[i * 4]; s += val; sx += (i % 28) * val; sy += Math.floor(i / 28) * val; }
    const dx = Math.round(13.5 - sx / s), dy = Math.round(13.5 - sy / s);
    const img = new Float32Array(784);
    for (let y = 0; y < 28; y++) for (let x = 0; x < 28; x++) { const ox = x - dx, oy = y - dy;
      if (ox >= 0 && ox < 28 && oy >= 0 && oy < 28) img[y * 28 + x] = td[(oy * 28 + ox) * 4] / 255; }
    update(img);
  }
  document.getElementById("clear").addEventListener("click", () => { clearPad(); });

  // primjeri iz MNIST-a
  const sbox = document.getElementById("samples");
  DATA.samples.forEach((b64, i) => {
    const btn = document.createElement("button"); btn.type = "button"; btn.textContent = String(i); btn.setAttribute("aria-label", "Primjer znamenke " + i);
    btn.addEventListener("click", () => loadSample(i)); sbox.appendChild(btn);
  });
  function loadSample(i) {
    const bytes = Uint8Array.from(atob(DATA.samples[i]), c => c.charCodeAt(0));
    const img = new Float32Array(784); for (let k = 0; k < 784; k++) img[k] = bytes[k] / 255;
    clearPad(); const id = pc.createImageData(28, 28);
    for (let k = 0; k < 784; k++) { id.data[k * 4] = id.data[k * 4 + 1] = id.data[k * 4 + 2] = bytes[k]; id.data[k * 4 + 3] = 255; }
    const t = document.createElement("canvas"); t.width = t.height = 28; t.getContext("2d").putImageData(id, 0, 0);
    pc.imageSmoothingEnabled = false; pc.drawImage(t, 0, 0, 280, 280);
    update(img);
  }
  window.__cnnCheck = () => { loadSample(3); return Array.from(state.dense).map(v => +v.toFixed(5)); };
  loadSample(3);
})();
</script>
